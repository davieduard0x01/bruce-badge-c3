[env_4mb]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	# Restrict IR protocols to save Flash on 4mb devices
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_HASH=true
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM


[env:badge-c3]
; ---- Cryptocurrency Village badge (ESP32-C3, 4MB) — build de teste ----
board = esp32-c3-devkitm-1
board_build.partitions = custom_4Mb_full.csv
board_upload.flash_size = 4MB
build_src_filter = ${env.build_src_filter} +<../boards/badge-c3>
build_flags =
	${env.build_flags}
	-Iboards/badge-c3
	-Iboards/ESP-General
	-DDEVICE_NAME='"L1System Badge"'
	-DHAS_SCREEN=1
	; ---- display ST7789 320x240 (pinos por RE do firmware original) ----
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=1
	-DTFT_INVERSION_ON=1
	-DTFT_CS=1
	-DTFT_DC=0
	-DTFT_RST=-1
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=40000000
	-DROTATION=1
	-DBACKLIGHT=-1
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DFP=1
	-DFM=2
	-DFG=3
	; ---- botoes: badge usa PCF8574 via I2C; sem GPIO direto (port pendente) ----
	-DBTN_ALIAS='"OK"'
	; ---- LEDs ----
	-DTXLED=8
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	; ---- sem SD / sem CC1101 / sem NRF (badge nao tem) ----
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	; ---- SPI generico (badge nao tem modulos SPI externos) ----
	-DSPI_SS_PIN=-1
	-DSPI_MOSI_PIN=-1
	-DSPI_MISO_PIN=-1
	-DSPI_SCK_PIN=-1
	; ---- Grove / IR / RF (pinos IR reais da badge: TX=2 RX=3) ----
	-DGROVE_SDA=2
	-DGROVE_SCL=3
	-DIR_TX_PINS='{{"IR", 2}}'
	-DIR_RX_PINS='{{"IR", 3}}'
	-DRF_TX_PINS='{{"RF", GROVE_SDA}}'
	-DRF_RX_PINS='{{"RF", GROVE_SCL}}'
	-DFM_RSTPIN=-1
	; ---- pinos de modulos ausentes (badge nao tem esse HW) definidos como -1 ----
	-DBAD_RX=-1
	-DBAD_TX=-1
	-DBAT_PIN=-1
	-DBTN_PIN=-1
	-DBUZZ_PIN=-1
	-DCC1101_GDO0_PIN=-1
	-DCC1101_GDO2_PIN=-1
	-DCC1101_MISO_PIN=-1
	-DCC1101_MOSI_PIN=-1
	-DCC1101_SCK_PIN=-1
	-DCC1101_SS_PIN=-1
	-DGPS_SERIAL_RX=-1
	-DGPS_SERIAL_TX=-1
	-DI2S_DATA_PIN=-1
	-DI2S_SCLK_PIN=-1
	-DLORA_CS=-1
	-DLORA_MISO=-1
	-DLORA_MOSI=-1
	-DLORA_RST=-1
	-DLORA_SCK=-1
	-DNRF24_CE_PIN=-1
	-DNRF24_MISO_PIN=-1
	-DNRF24_MOSI_PIN=-1
	-DNRF24_SCK_PIN=-1
	-DNRF24_SS_PIN=-1
	-DRTC_SCL=-1
	-DRTC_SDA=-1
	-DSERIAL_RX=-1
	-DSERIAL_TX=-1
	-DTCA8418_INT_PIN=-1
	-DTCA8418_SCL_PIN=-1
	-DTCA8418_SDA_PIN=-1
	-DTFT_MISO=-1
	-DW5500_INT_PIN=-1
	-DW5500_MISO_PIN=-1
	-DW5500_MOSI_PIN=-1
	-DW5500_RST_PIN=-1
	-DW5500_SCK_PIN=-1
	-DW5500_SS_PIN=-1
lib_ignore =
	RTC
	utility
lib_deps = ${env.lib_deps}
